    header {

      margin-bottom: 20px;

    .hero p {

      color: #6b6259;

    }

    .button {

      background: #2f2923;
      color: white;
      padding: 15px 28px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 14px;

    .collection {
      padding: 80px 6%;
      border-top: 1px solid #ddd5ca;
      text-align: center;
    }

    .collection h2 {
      font-size: 36px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .collection p {

    footer {
